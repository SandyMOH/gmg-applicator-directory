name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove non-deploy files
        run: |
          rm -rf .git .github README.md .gitignore
          ls -la
      
      - name: Debug server value
        run: |
          HOST='${{ secrets.SFTP_SERVER }}'
          echo "length: ${#HOST}"
          echo "looks like IPv4: $(echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' && echo YES || echo NO)"
          getent hosts "$HOST" || echo "DNS FAILED"
          
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /public_html/wp-content/plugins/applicator-directory/

      - name: Deployment complete
        run: echo "✅ Plugin deployed successfully!"